services:
  - type: web
    name: kadima-salud-jkbu
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix server ci && npm --prefix server exec -- prisma generate --schema=server/prisma/schema.prisma && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONTACT_TO
        value: contacto@kadimasalud.com.ar
      - key: CONTACT_SITE
        value: Kadima Salud
